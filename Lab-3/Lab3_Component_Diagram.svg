79" y="543" font-size="14">Record equipment returns</text><text x="779" y="564" font-size="14">Mark overdue reservations</text><text x="779" y="585" font-size="14">Apply late-return workflow</text><text x="1271" y="392" font-size="16" font-weight="700">&lt;&lt;component&gt;&gt;</text><text x="1271" y="420" font-size="16" font-weight="700">Lab Reservation Database</text><text x="1271" y="447" font-size="14">Students / roles</text><text x="1271" y="468" font-size="14">Equipment + calibration</text><text x="1271" y="489" font-size="14">Reservations / returns</text><text x="1271" y="510" font-size="14">Transactional locking</text></g><g font-family="Arial" font-size="12" fill="#364556"><text x="365" y="255" font-weight="700">IAuthAPI</text><text x="365" y="273">authentication / authorization</text><text x="466" y="400" font-weight="700">IReservationAPI</text><text x="466" y="418">availability / reserve / cancel</text><text x="696" y="378" font-weight="700">IEquipmentAPI</text><text x="696" y="396">validate calibration + slot availability</text><text x="365" y="548" font-weight="700">IEquipmentAPI</text><text x="365" y="566">availability / calibration</text><text x="555" y="641" font-weight="700">IReturnAPI</text><text x="555" y="659">return / overdue handling</text><text x="1114" y="420" font-weight="700">IRepository</text><text x="1114" y="438">transactional database access</text><text x="1114" y="514" font-weight="700">IRepository</text><text x="1114" y="532">returns + audit data</text></g><rect x="63" y="834" width="1445" height="105" rx="14" fill="#fff" stroke="#d5dce4"/><text x="82" y="860" font-family="Arial" font-size="18" font-weight="700">Interface / dependency notes</text><text x="82" y="885" font-family="Arial" font-size="13">• Solid connectors represent service communication; open circle = provided interface; socket = required interface.</text><text x="82" y="907" font-family="Arial" font-size="13">• Security: all restricted reservation/calibration operations pass through authentication + role authorization.</text><text x="82" y="929" font-family="Arial" font-size="13">• Concurrency: reservation writes use transactional database locking to prevent double-booking and support the 200 ms target.</text></svg>